name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  desktop-mcp:
    name: room-scoped desktop MCP tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Test standard-library stdio adapter
        working-directory: scripts/moltnet_mcp
        run: python3 -m unittest -v

  commit-message:
    name: Commit messages and author allowlist
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out pull request head with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check every pull request commit before install
        run: node .github/scripts/ci/commit-message.mjs --range "origin/$GITHUB_BASE_REF..HEAD"
      - name: Test commit policy
        run: |
          mkdir -p .tmp-commit-check
          TMPDIR="$PWD/.tmp-commit-check" node --test .github/scripts/ci/commit-message.test.mjs

  go-test:
    name: go vet + staticcheck + coverage
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Verify published Stele corpus
        run: ./scripts/verify-stele-corpus.sh

      - name: Verify published Daimon receipt schema
        run: ./scripts/verify-daimon-receipt-schema.sh

      - name: Go vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Check go mod tidy
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Go test with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Enforce coverage threshold
        shell: bash
        run: |
          set -euo pipefail
          go tool cover -func=coverage.out | tee coverage.txt
          total="$(awk '/^total:/{gsub("%","",$3); print $3}' coverage.txt)"
          awk -v total="$total" 'BEGIN { if (total + 0 < 80.0) exit 1 }'

  go-test-postgres:
    name: postgres-backed store tests
    timeout-minutes: 25
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: moltnet
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moltnet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MOLTNET_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/moltnet?sslmode=disable
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod

      - name: Postgres-backed store tests
        run: go test ./internal/store

      - name: Postgres-backed store tests with race detector
        run: go test -race ./internal/store

  go-race:
    name: go test -race
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Verify published Stele corpus
        run: ./scripts/verify-stele-corpus.sh

      - name: Verify published Daimon receipt schema
        run: ./scripts/verify-daimon-receipt-schema.sh

      - name: Go test -race
        run: go test -race ./...

  console-build:
    name: operator console build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install console deps
        working-directory: web
        run: npm ci

      - name: Typecheck console
        working-directory: web
        run: npm run typecheck

      - name: Build console
        working-directory: web
        run: npm run build

      - name: Check embedded console assets
        run: git diff --exit-code web/dist

  relay-test:
    name: cloudflare relay tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install relay deps
        working-directory: relay
        run: npm ci

      - name: Test relay
        working-directory: relay
        run: npm test

      # Content-based, and authoritative. The Go suite used to infer staleness
      # from mtimes, which a git checkout does not preserve; the committed
      # bundle could look older than its source purely by checkout write order.
      # This job already has Node, so it can just rebuild and compare bytes.
      - name: Verify the committed relay bundle matches its source
        working-directory: relay
        run: |
          npm run bundle
          git diff --exit-code -- dist \
            || { echo "::error::relay/dist is stale: run 'npm run bundle' in relay/ and commit the result"; exit 1; }

  docs-build:
    name: docs site build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install docs deps
        working-directory: website
        run: npm ci

      - name: Build docs
        working-directory: website
        run: npm run build
